version: '3.8'

services:
  db:
    image: postgres:16
    container_name: lab-db
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=lab
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: lab1-backend
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: lab1-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"